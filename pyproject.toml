[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abucache"
version = "0.5.0"
description = "Content-addressed caches and the link fast path for N64 decompilation builds"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["diskcache>=5.6"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abucache = ["event.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
